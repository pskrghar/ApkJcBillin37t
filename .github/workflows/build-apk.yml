
name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Select APK build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build JCBilling Android APK
    runs-on: ubuntu-latest

    env:
      BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'debug' }}
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Configure preinstalled Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "platform-tools"

      # 5. Install Node dependencies
      - name: Install Dependencies
        run: npm install

      # 6. Build web app and sync Capacitor
      - name: Build Web Bundle and Sync Capacitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run build
          node scripts/generate-android-assets.js
          npx cap sync android

      # 7. Decode release keystore
      - name: Decode Release Keystore
        id: keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      # 8. Make Gradle executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # 9. Build Debug APK
      - name: Build Debug APK
        if: env.BUILD_VARIANT != 'release'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 10. Build Release APK
      - name: Build Release APK
        if: env.BUILD_VARIANT != 'debug'
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release-key.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # 11. Upload Debug APK
      - name: Upload Debug APK
        if: env.BUILD_VARIANT != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: JCBilling-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Upload Release APK
      - name: Upload Release APK
        if: env.BUILD_VARIANT != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: JCBilling-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
